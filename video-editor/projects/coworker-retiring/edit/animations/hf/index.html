<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111; }
      #root { position: relative; width: 100%; height: 100%; font-family: 'Inter', sans-serif; }
      #stage { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 40%; }
      #header { position: absolute; left: 0; right: 0; top: 0; height: 760px; z-index: 2;
                 background: linear-gradient(to bottom, #1A1D24 0%, #1A1D24 44%, rgba(26,29,36,0.85) 58%, rgba(26,29,36,0) 100%); }
      #footage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="46.75" data-width="1080" data-height="1920">
      <div id="stage" data-layout-allow-overflow><div id="cam">
        <video id="footage" class="clip" src="assets/footage.mp4" data-start="0" data-duration="46.766" data-track-index="0" muted playsinline></video>
      </div></div>
      <div id="header"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0.300" data-duration="7.150" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="question" data-composition-id="question" data-composition-src="compositions/question.html" data-start="7.550" data-duration="1.750" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="step1" data-composition-id="step1" data-composition-src="compositions/step1.html" data-start="9.450" data-duration="8.550" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="formula" data-composition-id="formula" data-composition-src="compositions/formula.html" data-start="18.100" data-duration="6.250" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="result" data-composition-id="result" data-composition-src="compositions/result.html" data-start="24.450" data-duration="7.050" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="simple" data-composition-id="simple" data-composition-src="compositions/simple.html" data-start="31.650" data-duration="2.450" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="35.850" data-duration="10.900" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0.000" data-duration="46.750" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:7"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#cam", { y: 340, scale: 1.0 }, 0.000);
      tl.set("#cam", { y: 340, scale: 1.1 }, 2.700);
      tl.set("#cam", { y: 340, scale: 1.0 }, 3.370);
      tl.set("#cam", { y: 340, scale: 1.07 }, 9.150);
      tl.set("#cam", { y: 340, scale: 1.0 }, 18.100);
      tl.set("#cam", { y: 340, scale: 1.13 }, 23.350);
      tl.set("#cam", { y: 340, scale: 1.0 }, 24.450);
      tl.set("#cam", { y: 340, scale: 1.1 }, 31.650);
      tl.set("#cam", { y: 340, scale: 1.0 }, 32.850);
      tl.set("#cam", { y: 340, scale: 1.06 }, 35.850);
      tl.set("#cam", { y: 340, scale: 1.0 }, 41.130);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
