<!doctype html>
<html lang="en">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1440px; overflow: hidden; background: #F6F7F9; }
      #root { position: relative; width: 100%; height: 100%; font-family: 'Inter', sans-serif; }
      #ground { position: absolute; inset: 0; background: #F6F7F9; }
      #stage { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 26%; }
      #footage { position: absolute; left: 0; top: -11px; width: 1080px; height: 1462px; object-fit: cover; }
      #wash { position: absolute; inset: 0; background: #F6F7F9; z-index: 2; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="52.7" data-width="1080" data-height="1440">
      <div id="ground"></div>

      </div></div>
      <div id="wash"></div>

</html>
