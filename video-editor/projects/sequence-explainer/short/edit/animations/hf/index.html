<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F6F7F9; }
      #root { position: relative; width: 100%; height: 100%; font-family: 'Outfit', sans-serif; }
      #vstage { position: absolute; inset: 0; overflow: hidden; z-index: 4; clip-path: circle(1500px at 540px 760px); }
      #cam { position: absolute; inset: 0; transform-origin: 540px 760px; }
      #footage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #ring { position: absolute; left: 327px; top: 1287px; width: 426px; height: 426px;
               border-radius: 50%; border: 8px solid #5CA581; box-shadow: 0 20px 50px rgba(32,36,45,0.3); z-index: 5; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="63.7" data-width="1080" data-height="1920">
      <div id="vstage" data-layout-allow-overflow><div id="cam">
        <video id="footage" class="clip" src="assets/footage.mp4" data-start="0" data-duration="63.7" data-track-index="0" muted playsinline></video>
      </div></div>
      <div id="ring" data-layout-ignore></div>
      <div id="stage" data-composition-id="stage" data-composition-src="compositions/stage.html" data-start="6.500" data-duration="49.850" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0.800" data-duration="6.000" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:6"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="56.500" data-duration="4.750" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:6"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="61.250" data-duration="2.450" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:9"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0.000" data-duration="63.700" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:7"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#vstage", { clipPath: "circle(1500px at 540px 760px)" }, { clipPath: "circle(205px at 540px 1500px)", duration: 0.6, ease: "power3.inOut" }, 6.60);
      tl.fromTo("#cam", { scale: 1, y: 0 }, { scale: 0.37, y: 740, duration: 0.6, ease: "power3.inOut" }, 6.60);
      tl.fromTo("#ring", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 7.00);
      tl.to("#ring", { opacity: 0, duration: 0.2 }, 56.00);
      tl.to("#vstage", { clipPath: "circle(1500px at 540px 760px)", duration: 0.6, ease: "power3.inOut" }, 56.05);
      tl.to("#cam", { scale: 1, y: 0, duration: 0.6, ease: "power3.inOut" }, 56.05);
      tl.set("#cam", { scale: 1.12 }, 4.2);
      tl.set("#cam", { scale: 1.0 }, 6.3);
      tl.set("#cam", { scale: 1.1 }, 57.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
