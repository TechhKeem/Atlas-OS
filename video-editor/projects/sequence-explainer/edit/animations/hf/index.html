<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F6F7F9; }
      #root { position: relative; width: 100%; height: 100%; font-family: 'Outfit', sans-serif; }
      #ground { position: absolute; inset: 0; background: radial-gradient(110% 70% at 50% 20%, #FFFFFF 0%, #F6F7F9 55%, #E4ECE7 100%); }
      #stage { position: absolute; inset: 0; overflow: hidden; z-index: 2; clip-path: circle(1500px at 540px 760px); }
      #cam { position: absolute; inset: 0; transform-origin: 540px 760px; }
      #footage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #ring { position: absolute; left: 297px; top: 1177px; width: 486px; height: 486px;
               border-radius: 50%; border: 8px solid #5CA581; box-shadow: 0 20px 50px rgba(32,36,45,0.3); z-index: 3; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="120.7" data-width="1080" data-height="1920">
      <div id="ground"></div>
      <div id="stage" data-layout-allow-overflow><div id="cam">
        <video id="footage" class="clip" src="assets/footage.mp4" data-start="0" data-duration="120.7" data-track-index="0" muted playsinline></video>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#stage", { clipPath: "circle(1500px at 540px 760px)" }, { clipPath: "circle(235px at 540px 1420px)", duration: 0.6, ease: "power3.inOut" }, 8.900);
      tl.fromTo("#cam", { scale: 1, y: 0 }, { scale: 0.42, y: 660, duration: 0.6, ease: "power3.inOut" }, 8.900);
      tl.fromTo("#ring", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 9.300);
      tl.to("#ring", { opacity: 0, duration: 0.2 }, 65.050);
      tl.to("#stage", { clipPath: "circle(1500px at 540px 760px)", duration: 0.6, ease: "power3.inOut" }, 65.100);
      tl.to("#cam", { scale: 1, y: 0, duration: 0.6, ease: "power3.inOut" }, 65.100);
      tl.to("#stage", { clipPath: "circle(235px at 540px 1420px)", duration: 0.6, ease: "power3.inOut" }, 69.600);
      tl.to("#cam", { scale: 0.42, y: 660, duration: 0.6, ease: "power3.inOut" }, 69.600);
      tl.to("#ring", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 70.000);
      tl.to("#ring", { opacity: 0, duration: 0.2 }, 104.450);
      tl.to("#stage", { clipPath: "circle(1500px at 540px 760px)", duration: 0.6, ease: "power3.inOut" }, 104.500);
      tl.to("#cam", { scale: 1, y: 0, duration: 0.6, ease: "power3.inOut" }, 104.500);
      tl.set("#cam", { scale: 1.12 }, 5.350);
      tl.set("#cam", { scale: 1.0 }, 8.500);
      tl.set("#cam", { scale: 1.12 }, 67.400);
      tl.set("#cam", { scale: 1.0 }, 69.300);
      tl.set("#cam", { scale: 1.12 }, 107.700);
      tl.set("#cam", { scale: 1.0 }, 110.400);
      tl.set("#cam", { scale: 1.1 }, 113.850);
      window.__timelines["main"] = tl;
    </script>
