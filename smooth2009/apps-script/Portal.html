<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<title>S.M.O.O.T.H. Portal</title>
<style>
/* Brand kit tokens (brand-kit/tokens.json). Neutral surfaces, navy as the one S.M.O.O.T.H. color. */
:root{
  --bg:#ffffff; --bg-2:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --field-line:#86868b;
  --navy:#0b2a5b; --on-navy:#ffffff; --link:#0b4fb3; --ok:#1f7a38; --err:#c0262f; --warn:#8a5a00;
  --ok-bg:#e7f4ea; --err-bg:#fbe9ea; --warn-bg:#fdf3dc; --info-bg:#e8eefb;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --r-field:12px; --r-card:22px;
  color-scheme:light; /* always light, like the website */
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-2);color:var(--ink);font:17px/1.47 var(--f);letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
p{margin:0}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--link);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* Header */
header{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand img{height:34px;width:auto}
.who{font-size:13px;color:var(--muted);text-align:right}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
nav.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;font-size:15px;font-weight:500;color:var(--ink);white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--navy);color:var(--on-navy)}
nav.tabs button:focus-visible{outline:3px solid var(--link)}
main{padding-block:28px 64px}

/* Surfaces */
.card{background:var(--bg);border-radius:var(--r-card);padding:24px;display:grid;gap:14px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--bg-2);border-radius:16px;padding:14px 16px;display:grid;gap:2px}
.tile b{font-size:28px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted);font-weight:600}
.list{display:grid;gap:12px}
.item{background:var(--bg);border-radius:18px;padding:18px 20px;display:grid;gap:8px;min-width:0}
.item .meta{font-size:14px;color:var(--muted)}
.item .body{white-space:pre-wrap;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg-2);color:var(--ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.err{background:var(--err-bg);color:var(--err)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.info{background:var(--info-bg);color:var(--link)}
.todo{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.todo li{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:15px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right}
.bar{height:8px;border-radius:4px;background:var(--navy);min-width:2px}
blockquote{margin:0;padding:12px 14px;background:var(--bg-2);border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}

/* Forms */
form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.field{display:grid;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg-2);border:1px solid var(--field-line);border-radius:var(--r-field);padding:12px 14px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--link);outline-offset:1px;background:var(--bg)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--navy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:500 15px var(--f);padding:10px 18px;border-radius:999px;border:0;cursor:pointer;background:var(--navy);color:var(--on-navy);text-decoration:none}
.btn.quiet{background:var(--bg-2);color:var(--ink)}
.btn.danger{background:var(--err-bg);color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.form-foot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.status{font-size:15px;font-weight:500}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px;background:var(--bg-2)}
table input:not([type=checkbox]),table select{min-width:150px;padding:8px 10px}
td.nowrap{white-space:nowrap}
.brand{white-space:nowrap}
@media (max-width:640px){form{grid-template-columns:1fr}.card{padding:18px}.who{display:none}}

/* Sign-in */
.signin{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.signin .card{width:100%;max-width:420px;text-align:center;justify-items:center}
.signin form{grid-template-columns:1fr;width:100%;text-align:left}
.signin img{height:72px;width:auto}
</style>
</head>

<script>
"use strict";
const CREST = document.querySelector('#signin img').src;
let TOKEN = null, BOOT = null;
try { TOKEN = sessionStorage.getItem('smoothToken'); } catch (_) {}

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'text') el.textContent = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
function call(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(err => {
      const msg = (err && err.message) || String(err);
      if (/session ended|no longer has portal access/i.test(msg)) { setToken(null); showSignin(msg); }
      reject(new Error(msg));
    })[fn](...args);
  });
}
const api = (fn, ...args) => call(fn, TOKEN, ...args);
function setToken(t) { TOKEN = t; try { t ? sessionStorage.setItem('smoothToken', t) : sessionStorage.removeItem('smoothToken'); } catch (_) {} }
function say(el, msg, ok) { el.className = 'status ' + (ok ? 'ok' : 'err'); el.textContent = msg; }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(s) { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? MONTHS[+m[2] - 1] + ' ' + (+m[3]) + ', ' + m[1] : (s || ''); }
const money = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = n => Number(n || 0).toLocaleString('en-US');
const isInc = () => BOOT && BOOT.user.role === 'Inc';
const secName = s => (BOOT.sections[s] || s || '');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function pill(status) {
  const kind = { Submitted: 'info', Reviewed: 'ok', 'Needs changes': 'err', Incomplete: 'warn', Uploading: 'warn',
                 Pending: 'info', Approved: 'ok', Paid: 'ok', Denied: 'err', Proposed: 'info', Voting: 'warn',
                 Passed: 'ok', Failed: 'err', Withdrawn: '', Active: 'ok', Alumni: '', Inactive: '' }[status] || '';
  return h('span', { class: 'pill ' + kind, text: status || 'Draft' });
}
function field(label, input, opts) {
  opts = opts || {};
  return h('div', { class: 'field' + (opts.full ? ' full' : '') }, h('label', { for: input.id, text: label }), input, opts.hint ? h('p', { class: 'hint', text: opts.hint }) : null);
}
function select(id, options, value, extra) {
  return h('select', Object.assign({ id: id }, extra || {}), options.map(o => {
    const [v, t] = Array.isArray(o) ? o : [o, o];
    return h('option', { value: v, selected: v === value, text: t });
  }));
}
function sectionSelect(id, withAll) {
  const opts = Object.entries(BOOT.sections).map(([k, v]) => [k, v]);
  return select(id, withAll ? [['', 'All sections']].concat(opts) : [['', 'Choose a section']].concat(opts), '', withAll ? {} : { required: true });
}
function termSelect(id, value, withAll) {
  const opts = BOOT.terms.map(t => [t, t]);
  return select(id, withAll ? [['', 'All terms']].concat(opts) : opts, value === undefined ? BOOT.currentTerm : value);
}
function formData(form) {
  const o = {};
  form.querySelectorAll('input,select,textarea').forEach(el => { if (el.dataset.key) o[el.dataset.key] = el.type === 'checkbox' ? el.checked : el.value; });
  return o;
}
function keyed(el, key) { el.dataset.key = key; return el; }

/* Shrink photos in the browser before upload, so phone pictures go up quickly. */
async function prepFile(file, maxSide) {
  if (/^image\//.test(file.type) && file.type !== 'image/gif') {
    try {
      const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
      const s = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return { name: file.name, type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85) };
    } catch (_) { /* the browser can't decode it (for example HEIC on Chrome); send the original */ }
  }
  if (file.size > 10 * 1024 * 1024) throw new Error(file.name + ' is over 10 MB.');
  const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('Could not read ' + file.name)); r.readAsDataURL(file); });
  return { name: file.name, type: file.type || 'application/octet-stream', data };
}

/* ---------- sign-in ---------- */
let pendingEmail = '';
function showSignin(msg) {
  $('#app').hidden = true; $('#signin').hidden = false;
  $('#emailForm').hidden = false; $('#codeForm').hidden = true;
  const st = $('#signinStatus'); st.textContent = msg || ''; st.className = 'status' + (msg ? ' err' : '');
}
$('#emailForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button'); btn.disabled = true;
  pendingEmail = $('#si-email').value.trim();
  try {
    const r = await call('requestCode', pendingEmail);
    $('#emailForm').hidden = true; $('#codeForm').hidden = false; $('#signinStatus').textContent = '';
    $('#codeHint').textContent = r.message; $('#si-code').value = ''; $('#si-code').focus();
  } catch (err) { say($('#signinStatus'), err.message); }
  btn.disabled = false;
});
$('#codeForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button'); btn.disabled = true;
  try { const r = await call('verifyCode', pendingEmail, $('#si-code').value); setToken(r.token); start(r.boot); }
  catch (err) { say($('#signinStatus'), err.message); }
  btn.disabled = false;
});
$('#useOther').addEventListener('click', () => showSignin(''));
$('#signOut').addEventListener('click', async () => { try { await call('signOut', TOKEN); } catch (_) {} setToken(null); showSignin('You signed out.'); });

/* ---------- app shell ---------- */
const TABS = [
  ['overview', 'Overview'], ['events', 'Events'], ['funds', 'Funds'], ['members', 'Members'],
  ['amendments', 'Amendments'], ['chapter', 'Chapter'], ['newsletter', 'Newsletter', true]
];
let current = 'overview';
function start(boot) {
  BOOT = boot;
  $('#signin').hidden = true; $('#app').hidden = false;
  $('#who').textContent = (boot.user.name ? boot.user.name + ' · ' : '') + (boot.user.role === 'Inc' ? 'The Inc.' : boot.user.role === 'Applicant' ? 'Chapter applicant' : boot.user.sectionName + ' officer');
  $('#signOut').setAttribute('aria-label', 'Sign out ' + (boot.user.name || boot.user.email)); $('#signOut').title = $('#who').textContent;
  const tabs = $('#tabs'); tabs.replaceChildren();
  if (boot.user.role === 'Applicant') current = 'chapter';
  TABS.filter(t => (!t[2] || isInc()) && (boot.user.role !== 'Applicant' || t[0] === 'chapter')).forEach(([id, label]) => tabs.append(h('button', { type: 'button', 'data-tab': id, 'aria-current': id === current ? 'page' : 'false', onclick: () => go(id), text: label })));
  go(current);
}
function go(id) {
  current = id;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === id ? 'page' : 'false'));
  const view = $('#view'); view.replaceChildren(h('p', { class: 'muted', text: 'Loading…' }));
  VIEWS[id](view).catch(err => view.replaceChildren(h('div', { class: 'card' }, h('p', { class: 'status err', text: err.message }))));
}

/* ---------- Overview ---------- */
const VIEWS = {};
VIEWS.overview = async function (view, term) {
  const d = await api('getDashboard', term || BOOT.currentTerm);
  const ts = termSelect('ov-term', d.term); ts.addEventListener('change', () => VIEWS.overview(view, ts.value));
  const statKeys = [['roster', 'On the roster'], ['newMembers', 'New members'], ['events', 'Events reported'], ['attendees', 'Attendees'],
                    ['serviceHours', 'Service hours'], ['fundsRequested', 'Funds requested', money], ['fundsApproved', 'Funds approved', money], ['fundsPaid', 'Funds paid', money]];
  const tiles = src => h('div', { class: 'tiles' }, statKeys.map(([k, label, f]) => h('div', { class: 'tile' }, h('b', { text: (f || num)(src[k]) }), h('span', { text: label }))));
  const maxAtt = Math.max(1, ...d.trend.flatMap(r => d.sections.map(s => r[s.section] || 0)));
  view.replaceChildren(h('div', { class: 'stack' },
    h('div', { class: 'spread' }, h('h1', { text: 'Overview' }), h('div', { class: 'row' }, h('label', { for: 'ov-term', text: 'Term' }), ts)),
    d.todo.length ? h('div', { class: 'card' }, h('h2', { text: 'Needs attention' }), h('ul', { class: 'todo' }, d.todo.map(t => h('li', { text: t })))) : null,
    d.sections.length > 1 ? h('div', { class: 'card' }, h('h2', { text: 'All sections, ' + d.term }), tiles(d.total)) : null,
    ...d.sections.map(s => h('div', { class: 'card' }, h('div', { class: 'spread' }, h('h2', { text: s.name }), h('span', { class: 'muted small', text: num(s.activeMembers) + ' active · ' + num(s.alumni) + ' alumni in the directory' })), tiles(s))),
    h('div', { class: 'card' }, h('h2', { text: 'Attendance and roster size by term' }),
      h('div', { class: 'table-wrap' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', { text: 'Term' }), d.sections.flatMap(s => [h('th', { class: 'n', text: s.name + ' attendees' }), h('th', { text: '' }), h('th', { class: 'n', text: 'Roster' })]))),
        h('tbody', {}, d.trend.map(r => h('tr', {}, h('td', { text: r.term }),
          d.sections.flatMap(s => [h('td', { class: 'n', text: num(r[s.section]) }),
                                   h('td', { style: 'width:120px' }, h('div', { class: 'bar', style: 'width:' + Math.round(100 * (r[s.section] || 0) / maxAtt) + '%' })),
                                   h('td', { class: 'n', text: num(r[s.section + '_roster']) })])))))))
  ));
};

/* ---------- Events ---------- */
VIEWS.events = async function (view) {
  const list = await api('listEvents', {});
  const formCard = h('div', { class: 'card', hidden: true });
  const toggle = h('button', { class: 'btn', type: 'button', text: 'Report an event', onclick: () => { formCard.hidden = !formCard.hidden; if (!formCard.hidden) formCard.querySelector('input,select').focus(); } });
  formCard.append(eventForm(() => go('events')));
  view.replaceChildren(h('div', { class: 'stack' },
    h('div', { class: 'spread' }, h('div', {}, h('h1', { text: 'Events' }), h('p', { class: 'muted', text: 'Report each event after it happens: details, attendance, a summary for the newsletter, and at least ' + BOOT.minPhotos + ' photos.' })), toggle),
    formCard,
    list.length ? h('div', { class: 'list' }, list.map(eventItem)) : h('div', { class: 'card' }, h('p', { class: 'muted', text: 'No event reports yet. Use "Report an event" after your next event.' }))
  ));
};
function eventForm(done) {
  const photos = h('input', { id: 'ev-photos', type: 'file', accept: 'image/*', multiple: true, required: true });
  const thumbs = h('div', { class: 'thumbs', 'aria-live': 'polite' });
  const count = h('p', { class: 'hint', text: 'Choose at least ' + BOOT.minPhotos + ' photos (up to ' + BOOT.maxPhotos + ').' });
  photos.addEventListener('change', () => {
    thumbs.replaceChildren(...[...photos.files].slice(0, BOOT.maxPhotos).map(f => h('img', { src: URL.createObjectURL(f), alt: '' })));
    const n = photos.files.length;
    count.textContent = n + ' photo' + (n === 1 ? '' : 's') + ' chosen' + (n < BOOT.minPhotos ? ', ' + (BOOT.minPhotos - n) + ' more needed.' : n > BOOT.maxPhotos ? '. Only the first ' + BOOT.maxPhotos + ' will upload.' : '.');
  });
  const minors = keyed(select('ev-minors', [['', 'Choose'], ['No', 'No'], ['Yes', 'Yes']], '', { required: true }), 'minors_in_photos');
  const consent = keyed(select('ev-consent', [['', 'Choose'], ['Yes', 'Yes, written consent is on file'], ['No', 'No']], ''), 'parent_consent');

function rosterToText(rows) {

          h('tbody', {}, r.preview.map(p => h('tr', {}, h('td', { class: 'nowrap', text: p.first_name + ' ' + p.last_name }), h('td', { text: p.email }), h('td', { text: p.phone }), h('td', { text: p.grad_year }), h('td', { text: p.position })))))) : null].filter(Boolean));

  const title = h('input', { id: 'nl-title', value: (term || BOOT.currentTerm) + ' newsletter', maxlength: 100 });
  const status = h('p', { class: 'status', role: 'status' });
  const boxes = list.map(e => ({ e, cb: h('input', { type: 'checkbox', id: 'nl-' + e.event_id, checked: !e.newsletter_issue }) }));
  const make = h('button', { class: 'btn', type: 'button', text: 'Create newsletter draft', onclick: async () => {
    const ids = boxes.filter(b => b.cb.checked).map(b => b.e.event_id);
    if (!ids.length) { say(status, 'Choose at least one event.'); return; }
    make.disabled = true; say(status, 'Building the draft…', true);
    try { const r = await api('createNewsletterDraft', title.value, ids); status.className = 'status ok'; status.replaceChildren('Draft ready with ' + r.count + ' events: ', h('a', { href: r.url, target: '_blank', rel: 'noopener', text: 'open it in Google Docs' })); }

  view.replaceChildren(h('div', { class: 'stack' },
    h('div', {}, h('h1', { text: 'Newsletter' }), h('p', { class: 'muted', text: 'Each section\'s reviewed event reports, with their newsletter summaries. Pick the ones to include and create a Google Doc draft with one photo per event.' })),
    h('div', { class: 'card' },
      h('div', { class: 'row' }, field('Term', ts), field('Issue title', title)),
      list.length ? h('div', { class: 'list' }, boxes.map(({ e, cb }) => h('div', { class: 'item' },
        h('div', { class: 'row' }, cb, h('label', { for: cb.id }, h('b', { text: e.title }), ' · ' + secName(e.section) + ' · ' + fmtDate(e.event_date) + ' · ' + num(e.attendees) + ' attendees')),
