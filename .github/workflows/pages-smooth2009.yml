# Publishes the S.M.O.O.T.H. website (smooth2009/site) to GitHub Pages.
# Runs when site files change on the main branch, or by hand from the Actions tab.
# One-time setup in GitHub: Settings > Pages > Source: "GitHub Actions", then Custom domain: smooth2009.org.
name: Publish smooth2009.org

on:
  push:
    branches: [main]
    paths: ["smooth2009/site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: smooth2009/site
      - id: deployment
        uses: actions/deploy-pages@v4
